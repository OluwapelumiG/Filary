<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filary Sample Form</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 16px;
        color: #1c1917;
        background: #faf7f2;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-size: 0.9rem;
      }
      input,
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 16px;
      }
      .row label {
        flex: 1;
      }
      fieldset {
        border: 1px solid #d6d3d1;
        border-radius: 10px;
        margin: 16px 0;
      }
      .note {
        background: #ecfdf5;
        border: 1px solid #99f6e4;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 0.9rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Filary sample form</h1>
    <p class="note">
      1. Run <code>bun run server</code><br />
      2. Load the extension from <code>extension/dist</code><br />
      3. <strong>Click any field</strong> in this form<br />
      4. Press <code>⌘⇧Y</code> or <code>⌥⇧F</code>, or use the Filary popup
    </p>
    <form id="signup">
      <label>First name <input name="firstName" autocomplete="given-name" /></label>
      <label>Last name <input name="lastName" autocomplete="family-name" /></label>
      <label>Full name <input name="name" autocomplete="name" /></label>
      <label>Email <input type="email" name="email" autocomplete="email" /></label>
      <label>Phone <input type="tel" name="phone" autocomplete="tel" /></label>
      <label>
        Gender
        <select name="gender" autocomplete="sex">
          <option value="">Select…</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </label>
      <fieldset>
        <legend>Preferred contact</legend>
        <label><input type="radio" name="contactPref" value="email" /> Email</label>
        <label><input type="radio" name="contactPref" value="phone" /> Phone</label>
      </fieldset>
      <label>
        <input type="checkbox" name="newsletter" value="yes" />
        Subscribe to newsletter
      </label>
      <label>Date of birth <input type="date" name="dob" autocomplete="bday" /></label>
      <label>Address <input name="address" autocomplete="street-address" /></label>
      <div class="row">
        <label>City <input name="city" autocomplete="address-level2" /></label>
        <label>State <input name="state" autocomplete="address-level1" /></label>
      </div>
      <div class="row">
        <label>ZIP <input name="zip" autocomplete="postal-code" /></label>
        <label>Country <input name="country" autocomplete="country-name" /></label>
      </div>
      <label>Company <input name="company" autocomplete="organization" /></label>
      <label>Job title <input name="jobTitle" autocomplete="organization-title" /></label>
      <label>Username <input name="username" autocomplete="username" /></label>
      <label>Password <input type="password" name="password" autocomplete="new-password" /></label>
      <label>Website <input type="url" name="website" autocomplete="url" /></label>
      <label>About <textarea name="bio" rows="3"></textarea></label>
    </form>
  </body>
</html>
